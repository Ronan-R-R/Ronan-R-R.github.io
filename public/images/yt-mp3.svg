      <stop offset="100%" stop-color="#111118"/>
    </linearGradient>
    <radialGradient id="glowyt" cx="70%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="210" fill="url(#bgyt)"/>
  <rect width="600" height="210" fill="url(#glowyt)"/>
  <!-- Waveform -->
