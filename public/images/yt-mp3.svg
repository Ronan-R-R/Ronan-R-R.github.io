    <rect x="400" y="90" width="6" height="30" rx="3" opacity="0.5"/>
    <rect x="414" y="70" width="6" height="70" rx="3" opacity="0.7"/>
    <rect x="428" y="55" width="6" height="100" rx="3"/>
    <rect x="442" y="78" width="6" height="54" rx="3" opacity="0.8"/>
    <rect x="456" y="62" width="6" height="86" rx="3" fill="#A78BFA"/>
    <rect x="470" y="88" width="6" height="34" rx="3" opacity="0.6"/>
    <rect x="484" y="72" width="6" height="66" rx="3" opacity="0.8"/>
    <rect x="498" y="84" width="6" height="42" rx="3" opacity="0.5"/>
    <rect x="512" y="66" width="6" height="78" rx="3" fill="#A78BFA" opacity="0.8"/>
    <rect x="526" y="92" width="6" height="26" rx="3" opacity="0.5"/>
  </g>
  <!-- Download arrow -->
